<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Inicio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <header>
      <div class="clock">
        <div id="time"></div>
        <div id="date"></div>
      </div>
    </header>

    <section id="shelf" class="neutral">
      <div id="welcome">
        <div id="greeting"></div>
        <div class="subtitle">¿Qué vas a ver hoy?</div>
      </div>
      <div id="heroes"></div>
      <div id="hints">
        <span class="hint idle"><span class="key">◀ ▶</span>Elegir</span>
        <span class="hint selected"><span class="key">OK</span>Abrir</span>
        <span class="hint"><span class="key">1–7</span>Acceso directo</span>
      </div>
      <div id="opening"><span class="spinner"></span><span id="opening-text"></span></div>
    </section>

    <div id="row-title">Apps</div>
    <main id="row"></main>

    <div id="toast"></div>
  </div>

  <script src="apps.js"></script>
  <script src="main.js"></script>
</body>
</html>
